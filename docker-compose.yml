version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: loan-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sree_shyam_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  nextjs:
    build: .

    container_name: loan-app

    restart: unless-stopped

    depends_on:
      - postgres

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sree_shyam_db

volumes:
  postgres_data: